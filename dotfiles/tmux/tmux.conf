# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Status bar transparent background to inherit Ghostty's Noctalia palette
set -g status-style bg=default
set -g status-position bottom

# tmux-dotbar theme settings using terminal palette
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg-session "cyan"
set -g @tmux-dotbar-fg-current "green"
set -g @tmux-dotbar-fg-prefix "magenta"

# Load dotbar plugin
run-shell /run/current-system/sw/share/tmux-plugins/dotbar/dotbar.tmux