theme = "noctalia"

[editor]
line-number = "relative"
mouse = false
cursorline = true
color-modes = true
true-color = true
bufferline = "always"
auto-save = true
idle-timeout = 50
completion-trigger-len = 1
scrolloff = 5

# Use underline/bar so Helix yields to the native terminal cursor
[editor.cursor-shape]
normal = "underline"
insert = "bar"
select = "underline"

[editor.soft-wrap]
enable = true
max-wrap = 0
max-indent-retain = 30
wrap-indicator = "↪ "
wrap-at-text-width = false

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = false

[editor.indent-guides]
render = true
character = "│"
skip-levels = 1

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
"C-s" = ":w"
"C-q" = ":q"
space.f = "file_picker"
space.b = "buffer_picker"
space.w = "save_selection"
space.q = ":q"

# Strip Helix internal window/pane movement
"C-w" = "no_op"
"C-h" = "no_op"
"C-j" = "no_op"
"C-k" = "no_op"
"C-l" = "no_op"

[keys.insert]
"C-s" = ":w"
"C-c" = "normal_mode"

[keys.select]
esc = ["collapse_selection", "keep_primary_selection"]