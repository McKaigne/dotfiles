config_version = 20

[bar.fancy]
background_opacity = 0.80000000000000004
center = [ "workspaces" ]
end = [ "tray_2", "network", "volume", "input_volume", "brightness", "gap", "clock", "session" ]
padding = 18
start = [ "cpu", "ram", "temp", "gap", "media" ]
widget_spacing = 10

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
    color_2 = "primary"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.panel]
transparency_mode = "soft"

[theme]
builtin = "Nord"
community_palette = "Aura"
source = "community"

[wallpaper.default]
path = "/var/lib/wallpapers/isekaiJoucho.jpg"

[wallpaper.last]
path = "/var/lib/wallpapers/isekaiJoucho.jpg"

[wallpaper.monitors.DP-1]
path = "/var/lib/wallpapers/isekaiJoucho.jpg"

[wallpaper.monitors.eDP-1]
path = "/var/lib/wallpapers/isekaiJoucho.jpg"

[[wallpaper.favorite]]
community_palette = "Occult Umbral"
palette_source = "community"
path = "/var/lib/wallpapers/Hatsune.Miku.full.4725448.png"
theme_mode = "dark"

[[wallpaper.favorite]]
community_palette = "Aura"
palette_source = "community"
path = "/var/lib/wallpapers/isekaiJoucho.jpg"
theme_mode = "dark"

[[wallpaper.favorite]]
community_palette = "Zenbones"
palette_source = "community"
path = "/var/lib/wallpapers/Pretender.(Oberon).full.3921260.png"
theme_mode = "dark"

[widget.brightness]
glyph_position = "after"
peek = true

[widget.clock]
format = "{:%H:%M}"

[widget.cpu]
show_value = false
visualization = "gauge"

[widget.gap]
length = 14
type = "spacer"

[widget.input_volume]
glyph_position = "after"
peek = true

[widget.media]
max_length = 240

[widget.network]
peek = true
show_label = true

[widget.network_rx]
network_speed_compact = true
show_value = true
visualization = "none"

[widget.network_tx]
network_speed_compact = true
show_value = true
visualization = "none"

[widget.ram]
show_value = false
visualization = "gauge"

[widget.temp]
show_value = false
visualization = "gauge"

[widget.volume]
glyph_position = "after"
peek = true

[widget.workspaces]
pill_scale = 0.5
show_labels = false
style = "regular"