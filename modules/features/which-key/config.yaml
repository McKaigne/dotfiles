font: "Maple Mono NF 12"
background: "#1e1e2ed0"
color: "#cdd6f4"
border: "#89b4fa"
separator: " ➜ "
border_width: 1
corner_r: 4
padding: 15
column_padding: 20
anchor: center
menu:
  - key: "t"
    desc: "Terminal"
    submenu:
      - key: "a"
        desc: "Tmux Attach"
        cmd: "@ghostty@ -e @tmux@ attach"
      - key: "g"
        desc: "Lazygit"
        cmd: "@ghostty@ -e @lazygit@"
      - key: "b"
        desc: "Btop Monitor"
        cmd: "@ghostty@ -e @btop@"
  - key: "l"
    desc: "LocalSend"
    submenu:
      - key: "c"
        desc: "Send Clipboard"
        cmd: "@wl_paste@ | @localsend@"
      - key: "r"
        desc: "Receive (Open App)"
        cmd: "@localsend@"
  - key: "n"
    desc: "Noctalia"
    submenu:
      - key: "s"
        desc: "Silence Notifications"
        cmd: "@noctalia@ ipc call notifications toggleSilence"
      - key: "c"
        desc: "Clipboard History"
        cmd: "@noctalia@ ipc call launcher clipboard"
      - key: "b"
        desc: "Toggle Shell Bar"
        cmd: "@noctalia@ ipc call bar toggle"
  - key: "w"
    desc: "Window"
    submenu:
      - key: "t"
        desc: "Toggle Float / Tile"
        cmd: "@niri@ msg action toggle-window-floating"
      - key: "f"
        desc: "Fullscreen Window"
        cmd: "@niri@ msg action fullscreen-window"
      - key: "w"
        desc: "Maximize Width"
        cmd: "@niri@ msg action maximize-column"
      - key: "e"
        desc: "Reset Window Height"
        cmd: "@niri@ msg action reset-window-height"
  - key: "s"
    desc: "System"
    submenu:
      - key: "s"
        desc: "Power / Session Menu"
        cmd: "@noctalia@ ipc call sessionMenu toggle"
      - key: "l"
        desc: "Lock Screen"
        cmd: "@loginctl@ lock-session"
      - key: "z"
        desc: "Suspend System"
        cmd: "@systemctl@ suspend"
      - key: "r"
        desc: "Reboot System"
        cmd: "@systemctl@ reboot"