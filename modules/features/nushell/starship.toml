add_newline = false
palette = "noctalia"

# Line 1: [OS + Identity][Directory][Git][Time] -----------[fill]-----------> [Duration]
# Line 2: Character Status Indicator
format = """\
$os$username$hostname\
$directory\
$git_branch$git_status\
$time\
$fill\
$cmd_duration
$character"""

right_format = ""

[fill]
symbol = " "

# -----------------------------------------------------------------------------
# 1. Identity Segment (OS Icon + pollux@castor) - Accent: Red | BG: #3a3f5a
# -----------------------------------------------------------------------------
[os]
disabled = false
format = "[](fg:red)[$symbol ](fg:crust bg:red)"

[os.symbols]
NixOS = ""
Linux = "󰌽"

[username]
show_always = true
style_user = "fg:red bg:pill_bg bold"
style_root = "fg:red bg:pill_bg bold"
format = "[ $user]($style)"

[hostname]
ssh_only = false
style = "fg:red bg:pill_bg bold"
format = "[@$hostname ]($style)"

# -----------------------------------------------------------------------------
# 2. Directory Segment (Connected: transitions from #3a3f5a into green badge)
# -----------------------------------------------------------------------------
[directory]
style = "fg:green bg:pill_bg bold"
format = "[](fg:green bg:pill_bg)[󰉋 ](fg:crust bg:green)[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# -----------------------------------------------------------------------------
# 3. Git Segment (󰊢 Icon | Accent: Mauve)
# -----------------------------------------------------------------------------
[git_branch]
symbol = "󰊢"
style = "fg:mauve bg:pill_bg bold"
format = "[](fg:mauve bg:pill_bg)[$symbol ](fg:crust bg:mauve)[ $branch ]($style)"

[git_status]
style = "fg:mauve bg:pill_bg bold"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "󰳤 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "󰠦 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# -----------------------------------------------------------------------------
# 4. Time Segment (End of connected ribbon: closes with  in #3a3f5a)
# -----------------------------------------------------------------------------
[time]
disabled = false
time_format = "%R"
style = "fg:blue bg:pill_bg bold"
format = "[](fg:blue bg:pill_bg)[󰥔 ](fg:crust bg:blue)[ $time ]($style)[](fg:pill_bg)"

# -----------------------------------------------------------------------------
# 5. Right Side: Stopwatch / Duration Pill - Accent: Yellow
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
show_milliseconds = false
style = "fg:yellow bg:pill_bg bold"
format = "[](fg:yellow)[󱎫 ](fg:crust bg:yellow)[ $duration ]($style)[](fg:pill_bg)"

# -----------------------------------------------------------------------------
# Line 2 Character Indicator
# -----------------------------------------------------------------------------
[character]
disabled = false
success_symbol = "[  ](bold green)"
error_symbol = "[  ](bold red)"

# -----------------------------------------------------------------------------
# Noctalia Palette Fallback
# -----------------------------------------------------------------------------
[palettes.noctalia]
pill_bg   = "#3a3f5a"
blue      = "#89b4fa"
red       = "#f38ba8"
green     = "#a6e3a1"
yellow    = "#f9e2af"
cyan      = "#94e2d5"
magenta   = "#f5c2e7"
mauve     = "#f5c2e7"
white     = "#a6adc8"
black     = "#45475a"
surface1  = "#45475a"
surface0  = "#1e1e2e"
base      = "#1e1e2e"
mantle    = "#1e1e2e"
crust     = "#11111b"
text      = "#cdd6f4"
overlay0  = "#585b70"