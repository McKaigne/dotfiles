add_newline = false
palette = "noctalia"

# Line 1: [OS + User][Directory (Repo-Truncated)][Git][Time]
# Right Prompt: [Dev Env][Duration] (Auto-collapses in narrow panes!)
format = """\
$os$username$hostname\
$directory\
$git_branch$git_status\
$time\
$character"""

right_format = "$nix_shell$cmd_duration"

# -----------------------------------------------------------------------------
# 1. Identity Segment (OS Icon + User) - Accent: Red | BG: #3a3f5a
# -----------------------------------------------------------------------------
[os]
disabled = false
format = "[](fg:red)[$symbol ](fg:crust bg:red)"

[os.symbols]
NixOS = ""
Linux = "󰌽"

[username]
show_always = true
style_user = "fg:red bg:pill_bg bold"
style_root = "fg:red bg:pill_bg bold"
format = "[ $user]($style)"

# Only show @hostname over SSH to save 9 columns on local workstation
[hostname]
ssh_only = true
style = "fg:red bg:pill_bg bold"
format = "[@$hostname]($style)"

# -----------------------------------------------------------------------------
# 2. Directory Segment (Repo-Truncated to prevent overflow in split panes)
# -----------------------------------------------------------------------------
[directory]
style = "fg:green bg:pill_bg bold"
format = "[](fg:green bg:pill_bg)[󰉋 ](fg:crust bg:green)[ $path ]($style)"
truncation_length = 2
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "~"

# -----------------------------------------------------------------------------
# 3. Git Segment (󰊢 Icon | Accent: Mauve)
# -----------------------------------------------------------------------------
[git_branch]
symbol = "󰊢"
style = "fg:mauve bg:pill_bg bold"
format = "[](fg:mauve bg:pill_bg)[$symbol ](fg:crust bg:mauve)[ $branch ]($style)"

[git_status]
style = "fg:mauve bg:pill_bg bold"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "󰳤 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "󰠦 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# -----------------------------------------------------------------------------
# 4. Time Segment (End of left ribbon: closes with  in #3a3f5a)
# -----------------------------------------------------------------------------
[time]
disabled = false
time_format = "%R"
style = "fg:blue bg:pill_bg bold"
format = "[](fg:blue bg:pill_bg)[󰥔 ](fg:crust bg:blue)[ $time ]($style)[](fg:pill_bg)"

# -----------------------------------------------------------------------------
# 5. Dev Environment Segment (Cyan Sandbox Cube in Right Prompt)
# -----------------------------------------------------------------------------
[nix_shell]
disabled = false
symbol = "󰆍"
style = "fg:cyan bg:pill_bg bold"
format = "[](fg:cyan)[$symbol ](fg:crust bg:cyan)[ $name ]($style)[](fg:pill_bg) "
impure_msg = ""
pure_msg = ""
unknown_msg = "devenv"
heuristic = true

# -----------------------------------------------------------------------------
# 6. Stopwatch / Duration Pill (Yellow Pill in Right Prompt)
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
show_milliseconds = false
style = "fg:yellow bg:pill_bg bold"
format = "[](fg:yellow)[󱎫 ](fg:crust bg:yellow)[ $duration ]($style)[](fg:pill_bg)"

# -----------------------------------------------------------------------------
# Line 2 Character Indicator
# -----------------------------------------------------------------------------
[character]
disabled = false
success_symbol = "[  ](bold green)"
error_symbol = "[  ](bold red)"

# -----------------------------------------------------------------------------
# Noctalia Palette Fallback
# -----------------------------------------------------------------------------
[palettes.noctalia]
pill_bg   = "#3a3f5a"
blue      = "#89b4fa"
red       = "#f38ba8"
green     = "#a6e3a1"
yellow    = "#f9e2af"
cyan      = "#94e2d5"
magenta   = "#f5c2e7"
mauve     = "#f5c2e7"
white     = "#a6adc8"
black     = "#45475a"
surface1  = "#45475a"
surface0  = "#1e1e2e"
base      = "#1e1e2e"
mantle    = "#1e1e2e"
crust     = "#11111b"
text      = "#cdd6f4"
overlay0  = "#585b70"