add_newline = false

# Line 1: Left Ribbon -> Fill Space -> Right Status Pill ($cmd_duration)
# Line 2: Clean input line ($character)
format = """\
[](fg:bright-white)$os[](fg:bright-white bg:white)$directory[](fg:white bg:bright-black)$git_branch$git_status[](fg:bright-black bg:black)$time[](fg:black)$fill$cmd_duration
$character"""

# Empty right_format so Reedline leaves Line 2 completely blank
right_format = ""

[fill]
symbol = " "

# -----------------------------------------------------------------------------
# Logo (bright-white)
# -----------------------------------------------------------------------------
[os]
disabled = false
style = "fg:black bg:bright-white bold"
format = "[$symbol ]($style)"

[os.symbols]
NixOS = ""
Linux = "󰌽"
Debian = ""

# -----------------------------------------------------------------------------
# Directory (white / beige)
# -----------------------------------------------------------------------------
[directory]
style = "fg:black bg:white bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# -----------------------------------------------------------------------------
# Git Branch & Status (bright-black tier)
# -----------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "fg:white bg:bright-black bold"
format = "[ $symbol$branch(:$remote_branch) ]($style)"

[git_status]
style = "fg:white bg:bright-black"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "󰳤 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "󰠦 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# -----------------------------------------------------------------------------
# Time (black tier)
# -----------------------------------------------------------------------------
[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%R"
style = "fg:white bg:black"

# -----------------------------------------------------------------------------
# Execution Duration (Far Right of Line 1)
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
show_milliseconds = false
format = '[](fg:bright-white)[ 󱎫 $duration ](fg:black bg:bright-white bold)[](fg:bright-white)'

# -----------------------------------------------------------------------------
# Line 2 Status Indicator
# -----------------------------------------------------------------------------
[character]
disabled = false
success_symbol = "[ ](bold green)"
error_symbol = "[ ](bold red)"