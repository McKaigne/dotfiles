add_newline = true

# Left Ribbon (Light -> Dark):
# (Logo) ~ ) [git) ] time )
format = """
[](fg:bright-white)$os[](fg:bright-white bg:white)$directory[](fg:white bg:bright-black)$git_branch$git_status[](fg:bright-black bg:black)$time[](fg:black)
$character"""

# Right Prompt in Reverse Luminance Order (Dark -> Bright):
# [k8s(black)] [aws(bright-black)] [lang(white)] [duration(bright-white)]
right_format = """$kubernetes$aws$rust$python$golang$nodejs$c$zig$nix_shell$elixir$java$lua$cmd_duration"""

# -----------------------------------------------------------------------------
# Logo (bright-white) - Padded on both sides for full optical size
# -----------------------------------------------------------------------------
[os]
disabled = false
style = "fg:black bg:bright-white bold"
format = "[$symbol ]($style)"

[os.symbols]
NixOS = ""
Linux = "󰌽"
Debian = ""

# -----------------------------------------------------------------------------
# Directory (white / beige)
# -----------------------------------------------------------------------------
[directory]
style = "fg:black bg:white bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# -----------------------------------------------------------------------------
# Git Branch & Status (bright-black tier)
# -----------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "fg:white bg:bright-black bold"
format = "[ $symbol$branch(:$remote_branch) ]($style)"

[git_status]
style = "fg:white bg:bright-black"
format = "([$all_status$ahead_behind ]($style))"
conflicted = "󰳤 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
stashed = "󰠦 "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# -----------------------------------------------------------------------------
# Time (black tier)
# -----------------------------------------------------------------------------
[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%R"
style = "fg:white bg:black"

# -----------------------------------------------------------------------------
# Right Side: Languages (Icons Only, white tier)
# -----------------------------------------------------------------------------
[rust]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[python]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[golang]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[nodejs]
symbol = "󰎙"
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[c]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[zig]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[nix_shell]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[elixir]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[lua]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

[java]
symbol = ""
format = "[](fg:white)[ $symbol ](fg:black bg:white bold)[](fg:white) "

# -----------------------------------------------------------------------------
# Right Side: Execution Duration (Far Right: bright-white)
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
show_milliseconds = false
format = '[](fg:bright-white)[ 󱎫 $duration ](fg:black bg:bright-white bold)[](fg:bright-white)'

# -----------------------------------------------------------------------------
# Right Side: Cloud Contexts (Darker Tiers: black and bright-black)
# -----------------------------------------------------------------------------
[kubernetes]
disabled = false
symbol = "☸ "
format = '[](fg:black)[ $symbol$context ](fg:blue bg:black bold)[](fg:black) '

[aws]
disabled = false
symbol = " "
format = '[](fg:bright-black)[ $symbol$profile ](fg:yellow bg:bright-black bold)[](fg:bright-black) '

# -----------------------------------------------------------------------------
# Line 2 Execution Prompt
# -----------------------------------------------------------------------------
[character]
success_symbol = "[✓](bold green) "
error_symbol = "[✗](bold red) "
vicmd_symbol = "[✓](bold yellow) "