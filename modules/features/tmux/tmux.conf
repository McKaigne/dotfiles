# ==============================================================================
# Terminal & Capabilities
# ==============================================================================
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",*:RGB,*:clipboard"
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u

# ==============================================================================
# Prefixes: Ctrl + Space (Primary) & Ctrl + B (Secondary)
# ==============================================================================
unbind C-b
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

# General
bind q run-shell 'tmux source-file "$TMUX_CONF" && tmux display "Config reloaded from Nix store"'
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "tmux list-keys -N | less -R"
bind : command-prompt

# Indexing & Vi Mode
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
bind -N "Enter copy mode" [ copy-mode
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# ==============================================================================
# Panes
# ==============================================================================
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z

# Unprefixed Pane Splits & Navigation
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane

# Ctrl + Alt + Arrows & HJKL: Move between panes
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-h select-pane -L
bind -n C-M-l select-pane -R
bind -n C-M-k select-pane -U
bind -n C-M-j select-pane -D

# Ctrl + Alt + Shift + Arrows & HJKL: Resize panes
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Right resize-pane -R 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-H resize-pane -L 5
bind -n C-M-L resize-pane -R 5
bind -n C-M-K resize-pane -U 5
bind -n C-M-J resize-pane -D 5

# ==============================================================================
# Windows
# ==============================================================================
bind c new-window -c "#{pane_current_path}"
bind k kill-window
bind r command-prompt -I "#W" "rename-window -- '%%'"

# Alt + 1-9: Go to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt + Left/Right & HJKL: Move between windows
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-h previous-window
bind -n M-l next-window

# Alt + Shift + Left/Right & HJKL: Swap window left/right
bind -n M-S-Left swap-window -d -t -1
bind -n M-S-Right swap-window -d -t +1
bind -n M-H swap-window -d -t -1
bind -n M-L swap-window -d -t +1

# ==============================================================================
# Sessions
# ==============================================================================
bind C command-prompt -p "New session name:" "new-session -d -s '%%' ; switch-client -t '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind N switch-client -n
bind P switch-client -p
bind s choose-tree -s
bind d detach-client

# Alt + Up/Down & HJKL: Move between sessions
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n
bind -n M-k switch-client -p
bind -n M-j switch-client -n

# ==============================================================================
# Statusline (Bottom Position)
# ==============================================================================
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=default"

set -g status-left-length 40
set -g status-left "#[fg=brightblack,bg=default]#[fg=white,bg=brightblack]  #S#[fg=brightblack,bg=default]  "
set -g status-right-length 0
set -g status-right ""

set -g window-status-separator "  "
set -g window-status-current-format "#[fg=white,bg=default]#[fg=black,bg=white,bold]#I: #W#[fg=white,bg=default]"
set -g window-status-format "#[fg=brightblack,bg=default]#I #W"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
set -g message-style "bg=default,fg=white"
set -g message-command-style "bg=default,fg=white"
set -g mode-style "bg=white,fg=black"