# ==============================================================================
# Basic Settings & Capabilities
# ==============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,ghostty:RGB,xterm-256color:RGB,*:RGB"
set -as terminal-features ",*:RGB,*:clipboard"
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g history-limit 50000

# ==============================================================================
# Prefix: Ctrl + Space (Single Sole Prefix)
# ==============================================================================
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# ==============================================================================
# Splits: Mnemonic & CWD-Anchored (v: side-by-side | s: stacked)
# ==============================================================================
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# ==============================================================================
# Navigation: Unprefixed Alt + HJKL
# ==============================================================================
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==============================================================================
# Windows: 1-Based Indexing & Switching
# ==============================================================================
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind z resize-pane -Z

# ==============================================================================
# Actions & Config Reload
# ==============================================================================
bind r run-shell 'tmux source-file "$TMUX_CONF" && tmux display "Config reloaded from Nix store"'
bind S choose-tree -s

# ==============================================================================
# Vi Copy Mode & Wayland Clipboard (wl-copy)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# Floating Modal Tool Deck
# ==============================================================================
bind f display-popup -E -w 75% -h 65% -T " 󰒉 Tmux Sessionizer " "tmux-sessionizer"
bind C-f display-popup -E -w 75% -h 65% -T " 󰒉 Tmux Sessionizer " "tmux-sessionizer"
bind g display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "lazygit"
bind y display-popup -d "#{pane_current_path}" -w 85% -h 80% -E "yazi"
bind b display-popup -w 85% -h 80% -E "btop"
bind Enter display-popup -d "#{pane_current_path}" -w 80% -h 70% -E "nu"
bind Space display-popup -E -w 60% -h 50% -T " 󰖯 Windows " "tmux-window-picker"

# ==============================================================================
# Theme Colors (thm_bg set to "default" to match terminal background)
# ==============================================================================
thm_bg="default"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

source-file -q "$HOME/.cache/noctalia/tmux.conf"

# ==============================================================================
# Status Bar Styling (Seamless Terminal Background)
# ==============================================================================
set -g status "on"
set -g status-style "bg=default,fg=default"
set -g status-bg default
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=default,none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=default,none"

# Statusline - current window (Cyan  bullet on terminal-matching background)
set -g window-status-current-format "#[fg=${thm_blue},bg=default] #I: #[fg=${thm_cyan},bg=default] #[fg=${thm_cyan},bg=default]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) "

# Statusline - other windows
set -g window-status-format "#[fg=${thm_blue},bg=default] #I: #[fg=${thm_fg},bg=default]#W"

# Statusline - right side (Capsule floating over terminal background)
set -g status-right "#[fg=${thm_blue},bg=default,nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S #[fg=${thm_gray},bg=default,nobold,nounderscore,noitalics]"

# Statusline - left side
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"