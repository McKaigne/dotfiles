# ==============================================================================
# Basic Settings & Capabilities
# ==============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,ghostty:RGB,xterm-256color:RGB,*:RGB"
set -as terminal-features ",*:RGB,*:clipboard,*:cstyle"
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g history-limit 50000

# Ghostty GLSL Cursor Shader & Sync Support
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -as terminal-features ',*:sync:passthrough'

# ==============================================================================
# Prefix: Ctrl + b (Triggered via n + m in Kanata)
# ==============================================================================
unbind C-Space
unbind C-b
set -g prefix C-b
bind-key C-b send-prefix

# ==============================================================================
# 1. Pane Navigation & Actions (Zero-Prefix Alt)
# ==============================================================================
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-O select-pane -t :.+

bind -n M-z resize-pane -Z
bind -n M-f resize-pane -Z

unbind '"'
unbind %
bind -n M-n split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind -n M-q kill-pane
bind x kill-pane

bind -n -r M-Up resize-pane -U 2
bind -n -r M-Down resize-pane -D 2
bind -n -r M-Left resize-pane -L 2
bind -n -r M-Right resize-pane -R 2

bind -n M-m select-pane -m
bind -n M-b join-pane -s '{marked}'

# ==============================================================================
# 2. Windows: 1-Based Indexing & Actions (Zero-Prefix Alt)
# ==============================================================================
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Jump to Window 1-10 (Physical number row 1..0)
bind -n M-1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1 -c "#{pane_current_path}"'
bind -n M-2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2 -c "#{pane_current_path}"'
bind -n M-3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3 -c "#{pane_current_path}"'
bind -n M-4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4 -c "#{pane_current_path}"'
bind -n M-5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5 -c "#{pane_current_path}"'
bind -n M-6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6 -c "#{pane_current_path}"'
bind -n M-7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7 -c "#{pane_current_path}"'
bind -n M-8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8 -c "#{pane_current_path}"'
bind -n M-9 if-shell 'tmux select-window -t :9' '' 'new-window -t :9 -c "#{pane_current_path}"'
bind -n M-0 if-shell 'tmux select-window -t :10' '' 'new-window -t :10 -c "#{pane_current_path}"'

# Move Current Window to Position 1-10
bind -n 'M-!' swap-window -d -t 1
bind -n 'M-@' swap-window -d -t 2
bind -n 'M-#' swap-window -d -t 3
bind -n 'M-$' swap-window -d -t 4
bind -n 'M-%' swap-window -d -t 5
bind -n 'M-^' swap-window -d -t 6
bind -n 'M-&' swap-window -d -t 7
bind -n 'M-*' swap-window -d -t 8
bind -n 'M-(' swap-window -d -t 9
bind -n 'M-)' swap-window -d -t 10

bind -n M-H previous-window
bind -n M-L next-window
bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-c new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-Q kill-window

bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n 'M-,' command-prompt -I "#W" "rename-window '%%'"

# ==============================================================================
# 3. Session Navigation & System
# ==============================================================================
bind -n M-J switch-client -p
bind -n M-K switch-client -n

bind -n 'M-$' command-prompt -I "#S" "rename-session '%%'"

unbind r
bind r run-shell 'tmux source-file "$TMUX_CONF" && tmux display "Config reloaded from Nix store"'

# ==============================================================================
# 4. Vi Copy Mode & Wayland Clipboard (wl-copy)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "@wlCopy@"
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# 5. Floating Modal Tool Deck & Left-Hand Popups
# ==============================================================================
bind -n M-e display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "@nnn@ -e"

bind s display-popup -E -w 75% -h 65% -T " 󰒉 Sessions & Projects " "@tmuxSessionizer@"
bind w display-popup -E -w 75% -h 65% -T " 󰖯 Windows " "@tmuxWindowPicker@"
bind x display-popup -E -w 80% -h 70% -T " 󰅩 Helix Panes " "@tmuxHelixPicker@"

bind f display-popup -E -w 75% -h 65% -T " 󰒉 Sessions & Projects " "@tmuxSessionizer@"
bind g display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "@lazygit@"
bind y display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "@superfile@"
bind b display-popup -w 85% -h 80% -E "@btop@"
bind Enter display-popup -d "#{pane_current_path}" -w 80% -h 70% -E "@nu@"
bind Space display-popup -E -w 75% -h 65% -T " 󰖯 Windows " "@tmuxWindowPicker@"

# Dynamic Noctalia Palette Bridge
source-file -q "$HOME/.cache/noctalia/tmux.conf"

# ==============================================================================
# 6. Status Bar Styling (Dotbar Minimalist Theme)
# ==============================================================================
set -g status "on"
set -g status-position bottom
set -g status-style "bg=default,fg=#585b70"
set -g status-bg default
set -g status-justify absolute-centre
set -g status-left-length 50
set -g status-right-length 50

# Messages
set -g message-style "fg=#cdd6f4,bg=#313244,align=centre"
set -g message-command-style "fg=#cdd6f4,bg=#313244,align=centre"

# Panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Window List (Dotbar Minimalist Tabs with Centered Dots)
set -g window-status-separator "#[fg=#45475a] • "
set -g window-status-style "fg=#585b70,bg=default"
set -g window-status-format " #I #W#{?window_zoomed_flag, 󰊓,} "

set -g window-status-current-style "fg=#cdd6f4,bold,bg=default"
set -g window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-activity-style "fg=#fab387,bg=default,none"

# Left: Session indicator (Highlights in lavender with glyph when prefix is active)
set -g status-left "#{?client_prefix,#[fg=#cba6f7]#[bold] 󰌘 #S ,#[fg=#89b4fa] #S }"

# Right: Minimalist time
set -g status-right "#[fg=#585b70]%H:%M "

# Modes & Clock
set -g clock-mode-colour "#89b4fa"
set -g mode-style "fg=#89b4fa,bg=#313244,bold"