# ==============================================================================
# Terminal & Capabilities
# ==============================================================================
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",*:RGB,*:clipboard"
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u

# ==============================================================================
# Prefix & Config Reloading
# ==============================================================================
set -g prefix C-s
set -g prefix2 C-Space
bind -N "Send prefix" C-s send-prefix

# Safe reload expanding runtime store path
unbind r
bind r run-shell 'tmux source-file "$TMUX_CONF" && tmux display "Config reloaded from Nix store"'
bind q run-shell 'tmux source-file "$TMUX_CONF" && tmux display "Config reloaded from Nix store"'
bind ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "tmux list-keys -N | less -R"

# ==============================================================================
# Indexing & Vi Mode
# ==============================================================================
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# ==============================================================================
# Pane Navigation & Splits
# ==============================================================================
# Vim motions for pane switching
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Directional splits
bind -N "Split vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane
bind x kill-pane

# Alt arrow keys for pane resizing
unbind Up
unbind Down
unbind Left
unbind Right
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# ==============================================================================
# Window & Session Navigation
# ==============================================================================
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Rename window" R command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Previous window" b previous-window
bind -N "Previous window" -n M-H previous-window
bind -N "Next window" -n M-L next-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

# ==============================================================================
# Popups (Adapted for Castor Workstation)
# ==============================================================================
set -g popup-border-lines rounded
set -g popup-border-style "fg=white"

# C-y: Lazygit popup
bind C-y display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "lazygit"

# C-j: Fzf interactive session switcher
bind C-j display-popup -w 60% -h 60% -E "tmux list-sessions -F \"#{session_name}\" | fzf --reverse --header=\"Switch Session\" | xargs -r tmux switch-client -t"

# C-n: Prompt to create a new session
bind C-n command-prompt -p "New session name:" "new-session -d -s '%%' ; switch-client -t '%%'"

# C-r: Yazi file manager popup
bind C-r display-popup -d "#{pane_current_path}" -w 85% -h 85% -E "yazi"

# C-t: Scratchpad Nushell popup
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "nu"

# C-p: Python 3 REPL popup
bind C-p display-popup -w 80% -h 80% -E "python3"

# ==============================================================================
# Dotfiles Menu (Bound to 'd')
# ==============================================================================
bind d display-menu -T "#[align=centre]Castor NixOS Dotfiles" -x C -y C \
  "Flake (flake.nix)"   f "display-popup -d '/etc/nixos' -w 85% -h 85% -E 'hx flake.nix'" \
  "Nushell Config"      n "display-popup -d '/etc/nixos/modules/features/nushell' -w 85% -h 85% -E 'hx config.nu'" \
  "Tmux Config"         t "display-popup -d '/etc/nixos/modules/features/tmux' -w 85% -h 85% -E 'hx tmux.conf'" \
  "Niri Compositor"     w "display-popup -d '/etc/nixos/modules/features/niri' -w 85% -h 85% -E 'hx config.kdl'" \
  "Helix Config"        h "display-popup -d '/etc/nixos/modules/features/helix' -w 85% -h 85% -E 'hx config.toml'" \
  "Which-Key Menu"      k "display-popup -d '/etc/nixos/modules/features/which-key' -w 85% -h 85% -E 'hx config.yaml'" \
  "" \
  "Rebuild Workstation" r "display-popup -d '/etc/nixos' -w 85% -h 85% -E 'nu -c \"sudo nixos-rebuild switch --flake /etc/nixos#castor\"'" \
  "Exit"                q ""

# ==============================================================================
# Connected Statusline
# ==============================================================================
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=default"

# Session Pill on the left: [  0 ]
set -g status-left-length 40
set -g status-left "#[fg=brightblack,bg=default]#[fg=white,bg=brightblack]  #S#[fg=brightblack,bg=default]  "
set -g status-right-length 0
set -g status-right ""

# Window Tabs: Active is a bright pill [ 1: os ]; Inactive is unboxed text (2 wr  3 lk)
set -g window-status-separator "  "
set -g window-status-current-format "#[fg=white,bg=default]#[fg=black,bg=white,bold]#I: #W#[fg=white,bg=default]"
set -g window-status-format "#[fg=brightblack,bg=default]#I #W"

# Borders & Popups
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=white"
set -g message-style "bg=default,fg=white"
set -g message-command-style "bg=default,fg=white"
set -g mode-style "bg=white,fg=black"