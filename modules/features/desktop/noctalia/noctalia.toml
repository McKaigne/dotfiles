[backdrop]
blur_intensity = 0.6
enabled = true
tint_intensity = 0.35

[bar]
order = [ "top" ]

    [bar.top]
    background_opacity = 0.85
    border = "primary"
    border_width = 3.0
    capsule_opacity = 0.85
    capsule_radius = 0
    center = [ "workspaces" ]
    concave_edge_corners = false
    enabled = true
    start = [ "cpu", "ram", "temp" ]
    end = [ "weather", "battery", "clock" ]
    font_family = "Cozette"
    font_scale = 1.0
    margin_edge = 20
    margin_ends = 350
    margin_opposite_edge = 0
    position = "top"
    radius = 0
    shadow = false
    thickness = 32
    widget_spacing = 16

[location]
auto_locate = false
latitude = 14.5995
longitude = 120.9842

[shell]
app_icon_color = "on_surface_variant"
avatar_path = "/etc/nixos/avatar.jpg"
button_borders = false
card_borders = false
corner_radius_scale = 0.0
font_family = "Cozette"
input_borders = false
popup_borders = false
popup_shadows = false
settings_window_translucent = true

    [shell.panel]
    border_color = "primary"
    border_width = 3.0
    borders = true
    control_center_placement = "floating"
    session_placement = "floating"
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "floating"

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/etc/wallpapers"
fill_mode = "crop"
transition_duration = 200

    [wallpaper.default]
    path = "/etc/wallpapers/isekaiJoucho.jpg"

    [wallpaper.last]
    path = "/etc/wallpapers/isekaiJoucho.jpg"

    [wallpaper.monitors.DP-1]
    path = "/etc/wallpapers/isekaiJoucho.jpg"

[weather]
enabled = true

[widget.cpu]
show_glyph = false
visualization = "none"

[widget.ram]
show_glyph = false
visualization = "none"

[widget.temp]
show_glyph = false
visualization = "none"

[widget.weather]
enabled = true
show_condition = false

[widget.battery]
enabled = true
show_glyph = false

[widget.clock]
format = "{:%a %b %d  %H:%M}"

[widget.workspaces]
empty_color = "primary"
focused_color = "secondary"
hide_when_empty = false
label_source = "id"
occupied_color = "primary"
scroll_repeat = "steps"
style = "minimal"

[plugins]
enabled = [
    "noctalia/bitwarden",
    "kenn/keybind-cheatsheet",
    "8bury/lid-guard",
    "ayagmar/obs-control"
]
