[bar]
order = [ "top" ]

[bar.top]
background_opacity = 0.85
capsule_opacity = 0.88
capsule_radius = 4
center = [ "workspaces" ]
concave_edge_corners = false
enabled = true
end = [
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "battery",
    "volume",
    "input_volume",
    "brightness",
    "weather",
    "clock",
    "session"
]
font_family = "Lilex Nerd Font"
margin_edge = 0
margin_ends = 6
margin_opposite_edge = 0
position = "top"
radius = 0
shadow = false
start = [ "cpu", "temp", "ram" ]
thickness = 28
widget_spacing = 8

[dock]
active_opacity = 0.85
background_opacity = 0.85
shadow = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = ""
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
background_opacity = 0.85

[osd]
background_opacity = 0.85

[osd.kinds]
media = false

[shell]
app_icon_color = "on_surface_variant"
button_borders = false
card_borders = false
corner_radius_scale = 0.4
font_family = "Lilex Nerd Font"
input_borders = false
popup_borders = false
popup_shadows = false
settings_window_translucent = true

[shell.panel]
control_center_placement = "floating"
session_placement = "floating"
shadow = false
transparency_mode = "glass"
wallpaper_placement = "floating"

[theme]
builtin = "Noctalia"
community_palette = "Solarized Osaka"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "niri", "qt", "starship" ]
community_ids = [
    "brave",
    "brave-origin",
    "blender",
    "obs",
    "zathura",
    "whitesur-icons",
    "bat",
    "fzf",
    "glow",
    "lazygit",
    "yazi"
]
enable_builtin_templates = true

[theme.templates.user.ghostty]
input_path = "~/.config/noctalia/user-templates/ghostty"
output_path = "~/.config/ghostty/themes/noctalia"

[theme.templates.user.tmux]
input_path = "~/.config/noctalia/user-templates/tmux.conf"
output_path = "~/.config/tmux/themes/noctalia.conf"
post_hook = "tmux source-file ~/.config/tmux/tmux.conf 2>/dev/null || true"

[theme.templates.user.fuzzel]
input_path = "~/.config/noctalia/user-templates/fuzzel"
output_path = "~/.config/fuzzel/themes/noctalia"

[wallpaper]
directory = "/etc/nixos/wallpapers"
fill_mode = "crop"
transition_duration = 1500

[wallpaper.default]
path = "/etc/nixos/wallpapers/redSun.jpg"

[wallpaper.last]
path = "/etc/nixos/wallpapers/redSun.jpg"

[weather]
enabled = true

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.cpu]
show_glyph = false
visualization = "none"

[widget.media]
hide_album_art = true
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false
vpn_status = "both"

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
show_glyph = false
visualization = "none"

[widget.temp]
show_glyph = false
visualization = "none"

[widget.tray]
drawer = true

[widget.weather]
show_condition = false

[widget.workspaces]
empty_color = "primary"
focused_color = "secondary"
occupied_color = "primary"
scroll_repeat = "steps"
style = "minimal"
